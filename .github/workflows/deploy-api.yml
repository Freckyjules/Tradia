# Déploiement de l'API : à chaque fusion dans main, construit l'image Docker pour le
# Raspberry Pi (arm64), la publie sur GHCR, puis prévient Portainer de redéployer.
# Le Pipeline n'en fait pas partie : il tourne sur le PC Windows.
name: Déploiement API

on:
  push:
    branches: [main]
    paths:
      - "backend/Tradia.Api/**"
      - "backend/Tradia.Application/**"
      - "backend/Tradia.Domain/**"
      - "backend/Tradia.Infrastructure/**"
      - "backend/global.json"
      - "backend/.dockerignore"
      - "deploy/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# Deux déploiements ne se chevauchent pas : le second attend la fin du premier.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/freckyjules/tradia-api

jobs:
  deploiement:
    name: Construction, publication et mise à jour du Pi
    # Runner arm64 natif : la compilation pour le Pi ne passe pas par l'émulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest sert au déploiement, le SHA du commit permet de revenir en arrière.
      - name: Construction et publication de l'image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Tradia.Api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Portainer tire la nouvelle image et redémarre le conteneur.
      - name: Mise à jour du Pi
        run: curl --fail --silent --show-error --max-time 60 -X POST "$DEPLOY_WEBHOOK_URL"
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_API_WEBHOOK_URL }}
