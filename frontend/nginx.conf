server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Les fichiers compilés ont un hash dans leur nom : ils ne changent jamais
    # sous un même nom, le navigateur peut les garder un an.
    location ~* \.(?:js|css|ico|png|jpg|jpeg|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html, lui, doit être relu à chaque visite pour charger la dernière version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routes Angular (/accueil, etc.) : on renvoie index.html, le routeur du front prend la main.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Appels à l'API : relayés vers le conteneur tradia-api (reverse proxy). Le front et
    # l'API partagent le réseau Docker « tradia », où le nom du conteneur sert d'adresse.
    # L'adresse passe par une variable et le résolveur de Docker : nginx démarre même
    # si l'API est arrêtée (sinon il refuserait de se lancer) et suit ses redémarrages.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://tradia-api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
