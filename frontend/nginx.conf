server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Les fichiers compilés ont un hash dans leur nom : ils ne changent jamais
    # sous un même nom, le navigateur peut les garder un an.
    location ~* \.(?:js|css|ico|png|jpg|jpeg|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html, lui, doit être relu à chaque visite pour charger la dernière version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routes Angular (/accueil, etc.) : on renvoie index.html, le routeur du front prend la main.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # TODO : relayer /api vers le back quand il sera déployé.
}
