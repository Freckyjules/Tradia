# Déploiement de l'API sur le Raspberry Pi, géré comme une stack Portainer.
# L'image est construite et publiée par .github/workflows/deploy-api.yml.
services:
  tradia-api:
    image: ghcr.io/freckyjules/tradia-api:latest
    container_name: tradia-api
    restart: unless-stopped
    # Visible seulement depuis le Pi : c'est le tunnel Cloudflare qui l'expose sur Internet.
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Clés de signature du cookie de connexion, dans le volume : sans elles, chaque
      # mise à jour déconnecterait tous les utilisateurs.
      DataProtection__KeysPath: /data/keys
    # La base SQLite : sans ce volume, elle serait perdue à chaque mise à jour.
    volumes:
      - tradia-data:/data
    networks:
      - tradia

volumes:
  tradia-data:

# Réseau partagé par le front et l'API, à créer une fois sur le Pi :
#   docker network create tradia
networks:
  tradia:
    external: true
